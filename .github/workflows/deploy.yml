- name: Deploy to Server via SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "pwd && ls -ld ${TARGET_PATH%/}"
          sshpass -e rsync -avz --exclude='/legacy' -e "ssh -o StrictHostKeyChecking=no" out/ "$SSH_USER@$SSH_HOST:${TARGET_PATH%/}/"