- name: Deploy to Server via SSH
        uses: appleboy/rsync-action@master # or your scp/ssh deployment action
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "out/*"
          target: "public_html/"
          args: "-avz --exclude=/legacy" # Keeps your /legacy folder untouched!