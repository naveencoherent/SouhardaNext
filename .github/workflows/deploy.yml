- name: Deploy to Server via SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "ls -ld ~/public_html"
          sshpass -e rsync -avz --exclude='/legacy' -e "ssh -o StrictHostKeyChecking=no" out/ "$SSH_USER@$SSH_HOST:public_html/"