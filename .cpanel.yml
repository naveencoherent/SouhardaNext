name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main # Triggers deploy when you push to main branch

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Export
        run: npm run build

      - name: Sync to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ 216.10.251.230}}
          username: ${{ statesouhardafed }}
          password: ${{ State_Sou*123ltd }}
          local-dir: ./out/
          server-dir: /public_html/app/
          dangerous-clean-slate: false