[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[functions]
  node_bundler = "esbuild"
  # Exclude trace maps and public assets from the serverless zip payload
  included_files = ["!public/**", "!**/*.map", "!node_modules/**/*.md"]