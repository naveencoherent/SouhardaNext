[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  NEXT_PRIVATE_STANDALONE = "true"

[functions]
  node_bundler = "esbuild"
  included_files = ["!public/**", "!**/*.map", "!node_modules/**/*.md"]
  external_node_modules = ["sharp", "@swc/core", "typescript"]

[[plugins]]
  package = "@netlify/plugin-nextjs"