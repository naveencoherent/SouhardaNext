[build]
  command = "npx prisma generate --schema=./prisma/schema.prisma && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core", "@prisma/client", "prisma", "sharp"]