[build]
  command = "npm run build"
  publish = ".next/standalone"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[functions]
  node_bundler = "esbuild"
  included_files = ["!public/**", "!**/*.map", "!node_modules/**/*.md"]

[[plugins]]
  package = "@netlify/plugin-nextjs"