[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "!public/**",
    "!**/*.map",
    "!**/*.md",
    "!node_modules/@swc/**"
  ]

[[plugins]]
  package = "@netlify/plugin-nextjs"