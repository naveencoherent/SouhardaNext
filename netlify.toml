[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Exclude heavy assets from being zipped inside the serverless function zip payload
  included_files = ["!public/**", "!**/*.map", "!node_modules/**/*.md"]

[[plugins]]
  package = "@netlify/plugin-nextjs"