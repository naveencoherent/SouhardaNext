[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["!public/**", "!**/*.map", "!node_modules/**/*.md"]
  # Exclude heavy native/build dependencies from being bundled into serverless zips
  external_node_modules = ["sharp", "@swc/core", "typescript"]

[[plugins]]
  package = "@netlify/plugin-nextjs"